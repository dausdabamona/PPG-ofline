name: Build EXE Admin (Electron)

# PPG Sorong v2 — EXE admin (apps/desktop). Menggantikan workflow PyInstaller lama (T8).
on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pasang dependensi
        run: npm ci

      - name: Test & typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build EXE (nsis + portable)
        run: npm run dist:win -w apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Unggah EXE
        uses: actions/upload-artifact@v4
        with:
          name: PPG-Sorong-Admin-Windows
          path: |
            apps/desktop/release/*.exe
          retention-days: 30

      - name: Rilis (tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
