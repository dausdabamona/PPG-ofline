name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r desktop/requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        cd desktop
        pyinstaller PPG-Sorong.spec --clean

    - name: Create portable package
      run: |
        mkdir -p dist/PPG-Sorong-Portable/data
        mkdir -p dist/PPG-Sorong-Portable/backups
        cp desktop/dist/PPG-Sorong.exe dist/PPG-Sorong-Portable/
        echo "PPG Sorong - Portable Edition" > dist/PPG-Sorong-Portable/README.txt
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PPG-Sorong-Windows
        path: dist/PPG-Sorong-Portable/
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          desktop/dist/PPG-Sorong.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r desktop/requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        cd desktop
        pyinstaller PPG-Sorong.spec --clean

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PPG-Sorong-Linux
        path: desktop/dist/
        retention-days: 30
