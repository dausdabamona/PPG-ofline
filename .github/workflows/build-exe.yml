name: Build EXE Admin (Electron)

# PPG Sorong v2 — EXE admin (apps/desktop). Menggantikan workflow PyInstaller lama (T8).
on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pasang dependensi
        run: npm ci

      - name: Test & typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build EXE (nsis + portable)
        shell: bash
        # Bila gagal, ekor log dikirim sebagai anotasi agar terbaca tanpa login
        run: |
          set -o pipefail
          npm run dist:win -w apps/desktop 2>&1 | tee build.log || {
            msg=$(tail -c 3500 build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build EXE gagal::${msg}"
            exit 1
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Unggah EXE
        uses: actions/upload-artifact@v4
        with:
          name: PPG-Sorong-Admin-Windows
          path: |
            apps/desktop/release/*.exe
          retention-days: 30

      # Rilis "uji-terbaru" (tunggu sebentar agar tidak berebut membuat rilis dengan workflow APK)
      - name: Rilis uji-terbaru
        if: github.ref == 'refs/heads/claude/ppg-offline-v2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: uji-terbaru
          target_commitish: ${{ github.sha }}
          name: PPG Sorong v2 — Uji Terbaru
          prerelease: true
          files: apps/desktop/release/*.exe
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rilis (tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
