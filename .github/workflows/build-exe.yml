name: Build Windows Executable

on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r desktop/requirements.txt

    - name: Build executable
      run: |
        cd desktop
        pyinstaller PPG-Sorong.spec --clean

    - name: Create portable package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist/PPG-Sorong-Portable/data
        New-Item -ItemType Directory -Force -Path dist/PPG-Sorong-Portable/backups
        Copy-Item desktop/dist/PPG-Sorong.exe dist/PPG-Sorong-Portable/
        @"
        PPG Sorong - Portable Edition

        Cara Penggunaan:
        1. Jalankan PPG-Sorong.exe
        2. Login: admin / admin123
        3. Database otomatis dibuat di folder data

        "@ | Out-File -FilePath dist/PPG-Sorong-Portable/README.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PPG-Sorong-Windows
        path: dist/PPG-Sorong-Portable/
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          desktop/dist/PPG-Sorong.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
