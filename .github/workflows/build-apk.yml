name: Build APK (Capacitor)

# PPG Sorong v2 — APK HP (apps/mobile): satu APK untuk pengurus, mubaligh, generus, dan wali (T3).
on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang dependensi
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Test & typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build web APK
        run: npm run build -w apps/mobile

      - name: Capacitor sync
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: PPG-Sorong-APK
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rilis (tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
