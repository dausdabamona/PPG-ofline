name: Build APK (Capacitor)

# PPG Sorong v2 — APK HP (apps/mobile): satu APK untuk pengurus, mubaligh, generus, dan wali (T3).
on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    # ubuntu-24.04 sudah berisi Android SDK (ANDROID_HOME); setup-android@v3 gagal di runner baru
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cek Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Pasang dependensi
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Test & typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build web APK
        run: npm run build -w apps/mobile

      - name: Capacitor sync
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: apps/mobile/android
        # Bila gagal, ekor log dikirim sebagai anotasi agar terbaca tanpa login
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            msg=$(grep -E "error|FAILURE|What went wrong|wrong:|Could not|e: " build.log | tail -c 3500 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle gagal::${msg}"
            exit 1
          }

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: PPG-Sorong-APK
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Siapkan nama APK
        run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk PPG-Sorong.apk

      # Rilis "uji-terbaru": tautan unduh langsung tanpa login (diperbarui tiap push ke branch v2)
      - name: Rilis uji-terbaru
        if: github.ref == 'refs/heads/claude/ppg-offline-v2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: uji-terbaru
          target_commitish: ${{ github.sha }}
          name: PPG Sorong v2 — Uji Terbaru
          body: "APK HP dan EXE admin terbaru dari branch claude/ppg-offline-v2. Unduh PPG-Sorong.apk untuk HP Android."
          prerelease: true
          files: PPG-Sorong.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rilis (tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
